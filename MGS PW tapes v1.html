    <style>
        :root {
            --mgs-red: #cc0000;
            --mgs-bg: #1a1a1a;
            --mgs-text: #ffffff;
        }

        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }

       body {
		background-color: #2C2C2C;
		color: var(--mgs-text);
		font-family: 'Oswald', 'Bebas Neue', sans-serif;
		display: flex;
		justify-content: center;
		align-items: center;
		/*text-transform: uppercase;*/
		letter-spacing: 1px;
		}

        .briefing-container {
            width: 1200px; height: 700px; 
            background: rgba(10, 10, 10, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex; position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }

        .header {
            position: absolute; top: 25px; left: 25px;
            font-size: 28px; font-weight: bold; border-bottom: 2px solid white;
            padding-bottom: 5px; z-index: 10;
        }

        .file-library {
            width: 50%; margin-top: 90px; padding-left: 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
            background: rgba(0, 0, 0, 0.4);
            overflow-y: scroll; max-height: 580px; direction: rtl; 
        }

        /* Adaptive Scrollbar */
        .file-library::-webkit-scrollbar { width: 8px; }
        .file-library.not-scrolling::-webkit-scrollbar-track { background: #ffffff; }
        .file-library.not-scrolling::-webkit-scrollbar-thumb { background: transparent; }
        .file-library.is-scrolling::-webkit-scrollbar-track { background: transparent; }
        .file-library.is-scrolling::-webkit-scrollbar-thumb { background: #ffffff; }

        .menu-list { list-style: none; padding: 0; margin: 0; direction: ltr; }

        .menu-item {
            display: block; cursor: pointer; color: white; padding: 12px 15px; 
            font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s ease; text-decoration: none; white-space: nowrap;
        }

        .menu-item:hover { background-color: var(--mgs-red); padding-left: 25px; }
		
        .sub-menu {
            display: none; list-style: none; padding-left: 15px;
            background: rgba(255, 255, 255, 0.03); border-left: 2px solid var(--mgs-red);
        }

        .active > .sub-menu { display: block; }

        .portrait-area { width: 50%; display: flex; justify-content: center; align-items: center; }
        .portrait-card {
            width: 320px; height: 440px; background-color: #333; border: 10px solid #fff;
            position: relative; overflow: hidden;
        }
        .portrait-img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.2s; }
        }
    </style>
</head>

        const nav = document.getElementById('main-nav');
        const library = document.getElementById('library');
        const portraitImg = document.getElementById('portrait');

        function updateScrollbarState() {
            if (library.scrollHeight > library.clientHeight) {
                library.classList.replace('not-scrolling', 'is-scrolling');
            } else {
                library.classList.replace('is-scrolling', 'not-scrolling');
            }
        }

        // Build the Menu
        briefingData.forEach(char => {
            const charLi = document.createElement('li');
            charLi.innerHTML = `<div class="menu-item" data-img="${char.portrait}">${char.character}</div>`;
            const folderMenu = document.createElement('ul');
            folderMenu.className = 'sub-menu';

            char.folders.forEach(f => {
                const fLi = document.createElement('li');
                fLi.innerHTML = `<div class="menu-item sub-toggle" data-img="${char.portrait}">[+] ${f.folderName}</div>`;
                const fileMenu = document.createElement('ul');
                fileMenu.className = 'sub-menu';

                f.files.forEach(file => {
                    const fileLi = document.createElement('li');
                    fileLi.innerHTML = `<a href="${file.url}" target="_blank" class="menu-item" data-img="${char.portrait}">${file.title}</a>`;
                    fileMenu.appendChild(fileLi);
                });
                fLi.appendChild(fileMenu);
                folderMenu.appendChild(fLi);
            });
            charLi.appendChild(folderMenu);
            nav.appendChild(charLi);
        });

        // Click Logic (Accordion + Deep Reset)
        document.addEventListener('click', (e) => {
            const item = e.target;
            if (item.classList.contains('menu-item') && item.tagName !== 'A') {
                const parent = item.parentElement;
                const sub = parent.querySelector('.sub-menu');
                
                if (sub) {
                    const isOpening = !parent.classList.contains('active');
                    
                    if (isOpening) {
                        const siblings = parent.parentElement.children;
                        for (let sibling of siblings) {
                            if (sibling !== parent) {
                                sibling.classList.remove('active');
                                const toggle = sibling.querySelector('.sub-toggle');
                                if (toggle) toggle.innerText = toggle.innerText.replace('[-]', '[+]');
                                sibling.querySelectorAll('li.active').forEach(n => {
                                    n.classList.remove('active');
                                    const t = n.querySelector('.sub-toggle');
                                    if(t) t.innerText = t.innerText.replace('[-]', '[+]');
                                });
                            }
                        }
                        parent.classList.add('active');
                    } else {
                        parent.classList.remove('active');
                        parent.querySelectorAll('li.active').forEach(n => {
                            n.classList.remove('active');
                            const t = n.querySelector('.sub-toggle');
                            if(t) t.innerText = t.innerText.replace('[-]', '[+]');
                        });
                    }

                    if (item.classList.contains('sub-toggle')) {
                        const active = parent.classList.contains('active');
                        item.innerText = active 
                            ? item.innerText.replace('[+]', '[-]') 
                            : item.innerText.replace('[-]', '[+]');
                    }
                    setTimeout(updateScrollbarState, 10);
                }
            }
        });

        // Portrait Hover Update
        document.addEventListener('mouseover', (e) => {
            if(e.target.classList.contains('menu-item')) {
                const newImg = e.target.getAttribute('data-img');
                if(newImg && portraitImg.src !== newImg) {
                    portraitImg.style.opacity = '0';
                    setTimeout(() => {
                        portraitImg.src = newImg;
                        portraitImg.style.opacity = '1';
                    }, 100);
                }
            }
        });

        // Initialize first image
        if(briefingData.length > 0) {
            portraitImg.src = briefingData[0].portrait;
            portraitImg.style.opacity = '1';
        }

        updateScrollbarState();
    </script>
